<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><script src="theme.js"></script><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex"><title>Project manager</title>
<link rel="stylesheet" href="common.css">
<style>
.row input,.row select{margin:0}
.pl{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px;margin-bottom:18px}
.pj{border:0;text-align:left;font:inherit;color:var(--ink);background:var(--c);border-radius:22px;padding:16px;cursor:pointer;transition:transform .3s,box-shadow .3s}
.pj:hover{transform:translateY(-5px) rotate(-.6deg)}.pj.on{box-shadow:inset 0 0 0 2.5px var(--accent)}
.pj b{display:block;font:700 1.1rem "Bricolage Grotesque",sans-serif;margin-bottom:6px}
.pj .lf{display:inline-block;background:rgba(255,255,255,.65);border-radius:999px;padding:2px 12px;font-size:13.5px;font-weight:500}
html[data-theme=dark] .pj .lf{background:rgba(255,255,255,.14)}
.pj.late .lf{background:#b3261e;color:#fff}.pj.done{opacity:.6}
.pj.add{display:grid;place-items:center;background:transparent;box-shadow:inset 0 0 0 2px var(--accent);color:var(--accent);font-weight:500;min-height:92px}
.two{display:grid;grid-template-columns:1.1fr 1fr;gap:14px;align-items:start}
@media(max-width:820px){.two{grid-template-columns:1fr}}
.hd{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:12px}.hd h2{font-size:1.4rem}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}.cal small{text-align:center;color:var(--muted);font-size:12px}
.d{min-height:54px;border:0;border-radius:12px;background:rgba(255,255,255,.6);color:inherit;font:inherit;cursor:pointer;padding:3px;display:flex;flex-direction:column;align-items:center;gap:3px;transition:transform .2s}
html[data-theme=dark] .d{background:rgba(255,255,255,.09)}
.d:hover{transform:scale(1.08);position:relative;z-index:1}.d.t{box-shadow:inset 0 0 0 2px var(--accent)}
.d.in{background:var(--lilac)}.d.sel{background:var(--accent);color:#fff}
.d i{display:flex;gap:3px}.d i u{width:7px;height:7px;border-radius:50%;background:var(--c)}
.d.sel i u{box-shadow:0 0 0 1.5px #fff}
.sw{display:flex;align-items:center;gap:10px;margin:2px 0 12px}.sw input{width:auto;margin:0;accent-color:var(--accent);transform:scale(1.3)}
.tm{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.tm span{background:var(--sky);border-radius:999px;padding:3px 6px 3px 12px;font-size:14px}.tm button{border:0;background:none;color:var(--ink);cursor:pointer;font:inherit}
label.l{display:block;font-size:13px;color:var(--muted);margin:0 0 3px 4px}
</style></head>
<body>
<div class="wrap wide" id="m" hidden><div class="top" id="bar"></div>
  <div class="pl" id="pl"></div>
  <div class="two">
    <div class="card"><div class="hd"><button class="btn sm alt" id="pv" aria-label="Previous month">‹</button><h2 id="mt"></h2><div class="row"><button class="btn sm alt" id="td">Today</button><button class="btn sm alt" id="nx" aria-label="Next month">›</button></div></div><div class="cal" id="cal"></div></div>
    <div class="card">
      <h2 id="ft" style="font-size:1.4rem;margin-bottom:12px">New project</h2>
      <input id="ti" placeholder="Title" maxlength="100">
      <textarea id="ds" placeholder="Description" maxlength="2000"></textarea>
      <div class="row"><div style="flex:1;min-width:140px"><label class="l" for="sd">Start date</label><input id="sd" type="date"></div><div style="flex:1;min-width:190px"><label class="l" for="du">Due</label><input id="du" type="datetime-local"></div></div>
      <div class="row"><div style="flex:1;min-width:140px"><label class="l" for="sts">Status</label><select id="sts"><option value="todo">To do</option><option value="doing">In progress</option><option value="done">Done</option></select></div></div>
      <div class="sw" style="margin-top:10px"><input id="rm" type="checkbox"><label for="rm">Email reminder</label><select id="rh" style="width:auto;margin:0"><option value="1">1 hour before</option><option value="24" selected>1 day before</option><option value="72">3 days before</option></select></div>
      <label class="l" for="tmi">Teammates (emails)</label>
      <div class="tm" id="tm"></div>
      <div class="row" style="margin-bottom:6px"><input id="tmi" type="email" placeholder="teammate@email.com" style="flex:1"><button class="btn sm alt" id="tma">Add</button></div>
      <p class="muted" style="font-size:13px;margin:0 0 12px">Teammates are saved as a list only. They can't see your account or data.</p>
      <div class="row"><button class="btn" id="sv">Create project</button><button class="del" id="dl" hidden>Delete</button><span class="muted" id="st"></span></div>
    </div>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="auth.js"></script>
<script>
guard("Project manager",()=>{
const C=["lilac","mint","peach","sky","butter","rose"],colr=id=>C[[...String(id)].reduce((a,c)=>a+c.charCodeAt(0),0)%6];
let rows=[],sel=null,tm=[],cur=new Date();
const p2=n=>String(n).padStart(2,"0"),iso=d=>d.getFullYear()+"-"+p2(d.getMonth()+1)+"-"+p2(d.getDate()),loc=t=>{const d=new Date(t);return iso(d)+"T"+p2(d.getHours())+":"+p2(d.getMinutes())};
const today=iso(new Date()),range=r=>{const e=iso(new Date(r.due_at));return[r.start_date&&r.start_date<e?r.start_date:e,e]};
function left(r){
  if(r.status==="done")return"Done";
  let ms=new Date(r.due_at)-Date.now();const late=ms<0;ms=Math.abs(ms);
  const m=Math.floor(ms/6e4),h=Math.floor(m/60),d=Math.floor(h/24),mo=Math.floor(d/30),y=Math.floor(mo/12);
  const s=[[y,"y"],[mo%12,"mo"],[d%30,"d"],[h%24,"h"],[m%60,"m"]].filter(x=>x[0]).slice(0,2).map(x=>x[0]+x[1]).join(" ")||"<1m";
  return late?"Overdue "+s:s+" left";
}
async function load(){
  const {data,error}=await sb.from("projects").select("*").order("due_at");
  rows=error?[]:data;
  rows.sort((a,b)=>(a.status==="done")-(b.status==="done")||new Date(a.due_at)-new Date(b.due_at));
  drawList();drawCal();
}
function drawList(){
  $("pl").innerHTML=rows.map(r=>`<button class="pj${r.id===sel?" on":""}${r.status==="done"?" done":""}${r.status!=="done"&&new Date(r.due_at)<Date.now()?" late":""}" data-id="${esc(r.id)}" style="--c:var(--${colr(r.id)})"><b>${esc(r.title)}</b><span class="lf">${left(r)}</span></button>`).join("")+`<button class="pj add" data-new="1">＋ New project</button>`;
}
function drawCal(){
  const y=cur.getFullYear(),mo=cur.getMonth(),first=new Date(y,mo,1).getDay(),n=new Date(y,mo+1,0).getDate(),s=rows.find(r=>r.id===sel),sr=s&&range(s);
  $("mt").textContent=cur.toLocaleString([],{month:"long",year:"numeric"});
  let h=["S","M","T","W","T","F","S"].map(d=>`<small>${d}</small>`).join("")+"<i></i>".repeat(first);
  for(let d=1;d<=n;d++){
    const k=y+"-"+p2(mo+1)+"-"+p2(d),ps=rows.filter(r=>{const[a,b]=range(r);return k>=a&&k<=b});
    h+=`<button class="d${k===today?" t":""}${sr&&k>=sr[0]&&k<=sr[1]?" in":""}${s&&range(s)[1]===k?" sel":""}" data-d="${k}"><span>${d}</span><i>${ps.slice(0,3).map(r=>`<u style="--c:var(--${colr(r.id)})"></u>`).join("")}</i></button>`;
  }
  $("cal").innerHTML=h;
}
function open(r){
  sel=r?r.id:null;tm=r?[...(r.teammates||[])]:[];
  $("ft").textContent=r?"Project details":"New project";$("sv").textContent=r?"Save changes":"Create project";$("dl").hidden=!r;
  $("ti").value=r?r.title:"";$("ds").value=r?r.description||"":"";$("sd").value=r?r.start_date||"":"";$("du").value=r?loc(r.due_at):"";
  $("sts").value=r?r.status:"todo";$("rm").checked=r?r.remind:false;$("rh").value=r?String(r.remind_hours):"24";$("st").textContent="";
  drawTm();drawList();drawCal();
}
const drawTm=()=>$("tm").innerHTML=tm.map((e,i)=>`<span>${esc(e)}<button data-i="${i}" aria-label="Remove">✕</button></span>`).join("");
$("pl").onclick=e=>{const b=e.target.closest("button");if(!b)return;b.dataset.new?open(null):open(rows.find(r=>r.id===b.dataset.id))};
$("cal").onclick=e=>{
  const b=e.target.closest("[data-d]");if(!b)return;const k=b.dataset.d;
  const ps=rows.filter(r=>{const[a,z]=range(r);return k>=a&&k<=z});
  if(ps.length){const i=ps.findIndex(r=>r.id===sel);open(ps[(i+1)%ps.length])}
  else if(!sel){$("du").value=k+"T09:00";$("st").textContent="Due date set. Fill in the rest."}
};
$("tm").onclick=e=>{const i=e.target.dataset.i;if(i!==undefined){tm.splice(+i,1);drawTm()}};
function addTm(e){e&&e.preventDefault();const v=$("tmi").value.trim().toLowerCase();
  if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(v)){$("st").textContent="Enter a valid email.";return}
  if(tm.length>=10){$("st").textContent="Up to 10 teammates.";return}
  if(!tm.includes(v))tm.push(v);$("tmi").value="";$("st").textContent="";drawTm()}
$("tma").onclick=addTm;$("tmi").onkeydown=e=>{if(e.key==="Enter")addTm(e)};
const go=n=>{cur=new Date(cur.getFullYear(),cur.getMonth()+n,1);drawCal()};
$("pv").onclick=()=>go(-1);$("nx").onclick=()=>go(1);$("td").onclick=()=>{cur=new Date();drawCal()};
$("sv").onclick=async()=>{
  const title=$("ti").value.trim(),du=$("du").value;
  if(!title||!du){$("st").textContent="A title and a due date are needed.";return}
  const v={title,description:$("ds").value.trim(),start_date:$("sd").value||null,due_at:new Date(du).toISOString(),status:$("sts").value,remind:$("rm").checked,remind_hours:+$("rh").value,teammates:tm};
  $("sv").disabled=true;
  const {data,error}=sel?await sb.from("projects").update(v).eq("id",sel).select().single():await sb.from("projects").insert(v).select().single();
  $("sv").disabled=false;
  if(error){$("st").textContent="Could not save.";return}
  await load();open(rows.find(r=>r.id===data.id));$("st").textContent="Saved.";
};
$("dl").onclick=async()=>{if(!sel||!confirm("Delete this project?"))return;const {error}=await sb.from("projects").delete().eq("id",sel);if(error){$("st").textContent="Could not delete.";return}await load();open(null)};
setInterval(drawList,30000);
load();
});
</script></body></html>
