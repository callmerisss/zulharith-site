<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><script src="theme.js"></script><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%235b4fd6'/%3E%3Cpath d='M20 20h24L20 44h24' fill='none' stroke='white' stroke-width='6.5' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet"><title>Admin login</title>
<style>:root{--ink:#27264a;--muted:#6b6a8c;--lilac:#e4defa;--mint:#d6f0e4;--sky:#d5e8fb;--peach:#fde3dc;--accent:#5b4fd6;color-scheme:light}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:linear-gradient(160deg,#f6f5ff,#eef6f2 60%,#fdf1ee);color:var(--ink);font:16px/1.6 "DM Sans",system-ui,sans-serif}
h1,h2,h3{font-family:"Bricolage Grotesque",system-ui,sans-serif;letter-spacing:-.02em;margin:0}
input,textarea{width:100%;font:inherit;color:var(--ink);background:#fff;border:1.5px solid #d9d6ee;border-radius:12px;padding:12px 14px;margin-bottom:10px}
textarea{min-height:110px;resize:vertical}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.btn{font:inherit;font-weight:500;border:0;border-radius:999px;padding:11px 22px;background:var(--accent);color:#fff;cursor:pointer}
.btn.alt{background:#fff;color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--ink)}
.btn.sm{padding:5px 14px;font-size:14px}
.msg{color:#b3261e;min-height:1.4em;margin:8px 0 0;font-size:15px}
body{display:grid;place-items:center;padding:70px 20px 20px}
.box{background:rgba(255,255,255,.75);backdrop-filter:blur(6px);border-radius:28px;padding:36px 30px;width:min(100%,400px)}
h1{font-size:2.2rem;margin-bottom:6px}.sub{color:var(--muted);margin:0 0 22px}
.back{display:block;text-align:center;margin-top:18px;color:var(--muted);font-size:15px}
.cf-turnstile{margin:2px 0 12px}
</style></head><body>
<main class="box">
  <h1>Admin</h1><p class="sub">Sign in to open your notes.</p>
  <form id="f">
    <input id="email" type="email" placeholder="Email" autocomplete="username" required>
    <input id="pw" type="password" placeholder="Password" autocomplete="current-password" required>
    <div class="cf-turnstile" data-sitekey="0x4AAAAAAF6yehX2YqBt5VJO"></div>
    <button class="btn" id="go" style="width:100%">Log in</button>
    <p class="msg" id="msg" role="alert"></p>
  </form>
  <a class="back" href="/">← Back to my site</a>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
<script>
const SUPABASE_URL="https://mesaszwdqcrzlpwnlhzf.supabase.co";
const SUPABASE_KEY="sb_publishable_ufV3JHtv5IZXw3UqZlLLXw_Qqv_NnME";
const ADMIN="zzzick123@gmail.com"; // only this email may use the admin pages
const isAdmin=u=>((u&&u.email)||"").toLowerCase()===ADMIN;
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const msg=document.getElementById("msg");
// Already signed in? Admin goes to the dashboard, everyone else goes to the tools page.
sb.auth.getSession().then(({data})=>{if(data.session)location.replace(isAdmin(data.session.user)?"/adminmain":"/tools")});
document.getElementById("f").addEventListener("submit",async e=>{
  e.preventDefault();msg.textContent="";
  const tk=window.turnstile?turnstile.getResponse():"";
  if(!tk){msg.textContent="Please complete the check above.";return}
  const go=document.getElementById("go");go.disabled=true;go.textContent="Logging in…";
  const reset=()=>{go.disabled=false;go.textContent="Log in";window.turnstile&&turnstile.reset()};
  const {data,error}=await sb.auth.signInWithPassword({email:email.value.trim(),password:pw.value,options:{captchaToken:tk}});
  if(error){
    console.warn("Login error:",error.message);
    msg.textContent=/captcha/i.test(error.message)?"The human check failed. Try again.":/confirm/i.test(error.message)?"This account's email is not confirmed yet.":"Wrong email or password. Try again.";
    reset();return;
  }
  if(!isAdmin(data.user)){ // a normal user: sign them out again and give the same generic message
    await Promise.race([sb.auth.signOut({scope:"local"}),new Promise(r=>setTimeout(r,1500))]).catch(()=>{});
    try{Object.keys(localStorage).filter(k=>/^sb-.*-auth-token/.test(k)).forEach(k=>localStorage.removeItem(k))}catch(x){}
    msg.textContent="Wrong email or password. Try again.";reset();return;
  }
  location.replace("/adminmain");
});
</script></body></html>
