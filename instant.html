<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><script src="theme.js"></script><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex"><title>Instant</title>
<link rel="stylesheet" href="common.css">
<style>
.live{display:inline-flex;align-items:center;gap:6px;font-size:14px;color:var(--muted)}
.live i{width:9px;height:9px;border-radius:50%;background:#2e9e6b;animation:pulse 1.6s infinite}
@keyframes pulse{50%{opacity:.25}}
.msg{white-space:pre-wrap;word-wrap:break-word;margin:0;animation:pop .4s cubic-bezier(.3,1.5,.5,1)}
@keyframes pop{from{transform:scale(.94);opacity:0}}
.msg a{color:var(--accent)}
.card .row{margin-top:10px}
</style></head>
<body data-title="Instant">
<div class="wrap" id="m" hidden><div class="top" id="bar"></div>
  <div class="card">
    <textarea id="b" placeholder="Paste a link or type something. It shows up on all your devices instantly." maxlength="5000"></textarea>
    <div class="row"><button class="btn" id="send">Send</button><span class="live"><i></i>Live</span><span class="muted" id="st"></span><button class="del" id="clr" style="margin-left:auto">Clear all</button></div>
  </div>
  <div id="list"></div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="common.js"></script>
<script>
boot(()=>{
let rows=[];
const link=s=>esc(s).replace(/https?:\/\/[^\s<]+/g,u=>`<a href="${u}" target="_blank" rel="noopener">${u}</a>`);
async function load(){
  const {data,error}=await sb.from("instants").select("*").order("created_at",{ascending:false}).limit(100);
  if(error){$("list").innerHTML='<div class="card muted">Could not load.</div>';return}
  rows=data;
  $("list").innerHTML=rows.length?rows.map(r=>`<div class="card"><p class="msg">${link(r.body)}</p><div class="meta"><span>${new Date(r.created_at).toLocaleString()}</span><span><button class="del" style="color:var(--accent)" data-a="cp" data-id="${esc(r.id)}">Copy</button> <button class="del" data-a="rm" data-id="${esc(r.id)}">Delete</button></span></div></div>`).join(""):'<div class="card muted">Nothing here yet.</div>';
}
async function send(){
  const body=$("b").value.trim();if(!body)return;
  $("send").disabled=true;
  const {error}=await sb.from("instants").insert({body});
  $("send").disabled=false;
  if(error){$("st").textContent="Could not send.";return}
  $("b").value="";$("st").textContent="";load();
}
$("send").onclick=send;
$("b").onkeydown=e=>{if(e.key==="Enter"&&(e.ctrlKey||e.metaKey))send()};
$("list").onclick=async e=>{
  const b=e.target.closest("button[data-a]");if(!b)return;
  const r=rows.find(x=>String(x.id)===b.dataset.id);if(!r)return;
  if(b.dataset.a==="cp"){try{await navigator.clipboard.writeText(r.body);b.textContent="Copied!";setTimeout(()=>b.textContent="Copy",1200)}catch(x){}}
  else{await sb.from("instants").delete().eq("id",r.id);load()}
};
$("clr").onclick=async()=>{if(rows.length&&confirm("Delete everything here?")){await sb.from("instants").delete().in("id",rows.map(r=>r.id));load()}};
sb.channel("instants").on("postgres_changes",{event:"*",schema:"public",table:"instants"},load).subscribe();
load();
});
</script></body></html>
