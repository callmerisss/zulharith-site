<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><script src="theme.js"></script><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex"><title>Note generator</title>
<link rel="stylesheet" href="common.css">
<style>
.drop{display:flex;flex-direction:column;align-items:center;gap:4px;padding:28px 20px;margin-bottom:12px;border:2px dashed var(--accent);border-radius:24px;background:rgba(255,255,255,.55);cursor:pointer;text-align:center;transition:transform .25s,background .25s}
.drop:hover,.drop.on{background:var(--lilac);transform:scale(1.01)}.drop .big{font-size:2.4rem}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.chip{background:var(--mint);border-radius:999px;padding:4px 6px 4px 14px;font-size:14px}
.chip button{border:0;background:none;cursor:pointer;color:var(--ink);font:inherit;padding:0 6px}
#out{min-height:320px;font-size:15.5px;line-height:1.6}
.row input,.row select{margin:0}
</style></head>
<body>
<div class="wrap" id="m" hidden><div class="top" id="bar"></div>
  <div class="card">
    <label class="drop" id="dz"><span class="big">✨</span><b>Drop photos, PDFs or text files</b><span class="muted">or tap to choose · up to 6 files, 8 MB each</span><input id="f" type="file" accept="image/*,application/pdf,.txt,.md" multiple hidden></label>
    <div class="chips" id="chips"></div>
    <textarea id="tx" placeholder="Or paste / type your text here…" maxlength="40000"></textarea>
    <div class="row"><select id="sty" style="flex:1;min-width:180px"><option value="summary">Short summary</option><option value="detailed">Detailed study notes</option><option value="bullets">Bullet points</option><option value="qa">Questions and answers</option></select><button class="btn" id="go">Generate notes</button></div>
    <p class="muted" id="st"></p>
  </div>
  <div class="card" id="res" hidden><h3>Your notes</h3><textarea id="out" readonly></textarea><div class="row"><button class="btn sm" id="cp">Copy</button><button class="btn sm alt" id="dl">Download .txt</button></div></div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="auth.js"></script>
<script>
guard("Note generator",()=>{
const items=[];
const rdu=f=>new Promise((ok,no)=>{const r=new FileReader();r.onload=()=>ok(r.result);r.onerror=no;r.readAsDataURL(f)});
async function img(f){ // shrink big photos so uploads stay fast
  const u=await rdu(f),i=new Image();await new Promise((r,x)=>{i.onload=r;i.onerror=x;i.src=u});
  const k=Math.min(1,1600/Math.max(i.width,i.height)),c=document.createElement("canvas");
  c.width=Math.round(i.width*k);c.height=Math.round(i.height*k);c.getContext("2d").drawImage(i,0,0,c.width,c.height);
  return c.toDataURL("image/jpeg",.85).split(",")[1];
}
const draw=()=>$("chips").innerHTML=items.map((x,i)=>`<span class="chip">${x.k==="image"?"🖼️":x.k==="pdf"?"📕":"📄"} ${esc(x.name)}<button data-i="${i}" aria-label="Remove">✕</button></span>`).join("");
async function add(list){
  for(const f of list){
    if(items.length>=6){$("st").textContent="Up to 6 files.";break}
    if(f.size>8e6){$("st").textContent=f.name+" is over 8 MB.";continue}
    try{
      if(f.type.startsWith("image/"))items.push({k:"image",name:f.name,d:await img(f)});
      else if(f.type==="application/pdf")items.push({k:"pdf",name:f.name,d:(await rdu(f)).split(",")[1]});
      else if(/\.(txt|md)$/i.test(f.name)||f.type==="text/plain")items.push({k:"text",name:f.name,d:(await f.text()).slice(0,40000)});
      else $("st").textContent=f.name+": file type not supported.";
    }catch(e){$("st").textContent="Could not read "+f.name}
  }
  draw();
}
$("f").onchange=e=>{add([...e.target.files]);e.target.value=""};
$("dz").ondragover=e=>{e.preventDefault();$("dz").classList.add("on")};
$("dz").ondragleave=()=>$("dz").classList.remove("on");
$("dz").ondrop=e=>{e.preventDefault();$("dz").classList.remove("on");add([...e.dataTransfer.files])};
$("chips").onclick=e=>{const i=e.target.dataset.i;if(i!==undefined){items.splice(+i,1);draw()}};
$("go").onclick=async()=>{
  const files=items.filter(x=>x.k!=="text"),text=($("tx").value.trim()+"\n\n"+items.filter(x=>x.k==="text").map(x=>x.d).join("\n\n")).trim();
  if(!files.length&&!text){$("st").textContent="Add a file or some text first.";return}
  $("go").disabled=true;$("st").textContent="Reading everything and writing your notes…";
  try{
    const {data}=await sb.auth.getSession();
    const r=await fetch(AI_API+"/notes",{method:"POST",headers:{"Content-Type":"application/json",Authorization:"Bearer "+data.session.access_token},body:JSON.stringify({text,style:$("sty").value,files:files.map(x=>({kind:x.k,data:x.d}))})});
    const j=await r.json();if(!r.ok)throw new Error(j.error||r.status);
    $("out").value=j.notes;$("res").hidden=false;$("st").textContent="";$("res").scrollIntoView({behavior:"smooth"});
  }catch(e){$("st").textContent="Could not generate: "+e.message}
  $("go").disabled=false;
};
$("cp").onclick=async()=>{try{await navigator.clipboard.writeText($("out").value);$("cp").textContent="Copied!";setTimeout(()=>$("cp").textContent="Copy",1200)}catch(e){}};
$("dl").onclick=()=>{const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([$("out").value],{type:"text/plain"}));a.download="notes.txt";a.click()};
});
</script></body></html>
