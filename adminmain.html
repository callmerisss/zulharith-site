<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><script src="theme.js"></script><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex"><title>Dashboard</title>
<link rel="stylesheet" href="common.css">
<style>
.hero{margin:6px 0 30px}.hero h1{font-size:clamp(2.2rem,7vw,4rem)}.hero p{margin:8px 0 0;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px}
.tile{position:relative;overflow:hidden;display:flex;flex-direction:column;gap:4px;min-height:180px;padding:22px;border-radius:26px;background:var(--c);color:inherit;text-decoration:none;opacity:0;animation:up .7s cubic-bezier(.2,.8,.2,1) forwards;animation-delay:calc(var(--i)*80ms);transition:transform .35s cubic-bezier(.2,.8,.2,1),box-shadow .35s}
.tile::after{content:"";position:absolute;inset:0;background:radial-gradient(220px circle at var(--x,50%) var(--y,50%),rgba(255,255,255,.75),transparent 70%);opacity:0;transition:opacity .3s}
.tile:hover,.tile:focus-visible{transform:translateY(-8px) rotate(-1deg);box-shadow:0 18px 36px -14px rgba(39,38,74,.35)}
.tile:hover::after{opacity:1}
.tile>*{position:relative;z-index:1}
.tile .e{font-size:2.8rem;line-height:1;display:inline-block;transition:transform .4s cubic-bezier(.3,1.6,.5,1)}
.tile:hover .e{transform:scale(1.25) rotate(-12deg)}
.tile h3{font-size:1.6rem;margin-top:8px}.tile p{margin:0;color:var(--muted)}
.tile .go{margin-top:auto;font-weight:500;transition:transform .3s}.tile:hover .go{transform:translateX(8px)}
@keyframes up{from{opacity:0;transform:translateY(30px)}to{opacity:1}}
@media (prefers-reduced-motion:reduce){.tile{animation:none;opacity:1}}
</style></head><body>
<div class="wrap wide" id="m" hidden>
  <div class="top"><a class="btn alt sm" href="/">My site</a><button class="btn sm" id="out">Log out</button></div>
  <div class="hero"><h1 id="hi"></h1><p id="clk"></p></div>
  <div class="grid" id="g"></div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="common.js"></script>
<script>
boot(()=>{
  const h=new Date().getHours();
  $("hi").textContent=(h<12?"Good morning":h<18?"Good afternoon":"Good evening")+", Zulharith.";
  const c=()=>$("clk").textContent=new Date().toLocaleString([],{weekday:"long",day:"numeric",month:"long",hour:"2-digit",minute:"2-digit"});c();setInterval(c,15000);
  const T=[["Notes","📝","Write things down","/notes","lilac"],["File transfer","📤","Move files between devices","/files","mint"],["Instant","⚡","Send text and links in a flash","/instant","butter"],["Gallery","🖼️","Your photos, all in one place","/gallery","sky"],["Countdown","⏳","Count down to the big days","/countdown","peach"],["Fun calendar","🎈","Plan your days with emoji","/calendar","rose"]];
  $("g").innerHTML=T.map((t,i)=>`<a class="tile" href="${t[3]}" style="--c:var(--${t[4]});--i:${i}"><span class="e">${t[1]}</span><h3>${t[0]}</h3><p>${t[2]}</p><span class="go">Open →</span></a>`).join("");
  $("g").addEventListener("pointermove",e=>{const t=e.target.closest(".tile");if(!t)return;const r=t.getBoundingClientRect();t.style.setProperty("--x",e.clientX-r.left+"px");t.style.setProperty("--y",e.clientY-r.top+"px")});
});
</script></body></html>
