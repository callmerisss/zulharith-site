<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><script src="theme.js"></script><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex"><title>Timetable</title>
<link rel="stylesheet" href="common.css">
<style>
.tabs{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;margin:6px 0 18px}
.dy{position:relative;border:0;border-radius:18px;padding:10px 2px;background:rgba(255,255,255,.7);color:var(--ink);font:inherit;font-weight:500;cursor:pointer;transition:transform .25s cubic-bezier(.3,1.6,.5,1),background .2s}
html[data-theme=dark] .dy{background:rgba(255,255,255,.09)}
.dy:hover{transform:translateY(-3px)}
.tabs .dy.on{background:var(--accent);color:#fff;transform:translateY(-4px) scale(1.07)}
.dy small{display:block;font-size:11px;opacity:.75}
.dy.td::after{content:"";position:absolute;top:6px;right:8px;width:7px;height:7px;border-radius:50%;background:#2e9e6b}
.hd{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin:0 4px 14px;flex-wrap:wrap}.hd h2{font-size:1.7rem}
.tl{display:grid;gap:10px;padding-bottom:90px}
.bl{display:flex;gap:14px;align-items:center;border:0;text-align:left;width:100%;font:inherit;color:var(--ink);background:var(--c);border-radius:22px;padding:14px 16px;cursor:pointer;animation:pop .45s cubic-bezier(.3,1.5,.5,1) backwards;animation-delay:calc(var(--i)*60ms);transition:transform .25s,box-shadow .25s}
.bl:hover{transform:translateX(6px) rotate(-.4deg);box-shadow:0 12px 22px -12px rgba(39,38,74,.5)}
.bl .e{font-size:2rem;transition:transform .35s cubic-bezier(.3,1.7,.5,1)}.bl:hover .e{transform:scale(1.25) rotate(-10deg)}
.bl .t{flex:1;min-width:0}.bl b{display:block;font:700 1.1rem "Bricolage Grotesque",sans-serif}
.bl small{color:var(--muted)}.bl .n{font-size:12px;background:var(--accent);color:#fff;border-radius:999px;padding:2px 10px;animation:pulse 2s infinite}
@keyframes pop{from{opacity:0;transform:translateY(14px) scale(.96)}}
@keyframes pulse{50%{box-shadow:0 0 0 5px rgba(91,79,214,.3)}}
.free{text-align:center;padding:40px 10px;color:var(--muted)}.free .big{font-size:3rem;display:block;animation:wob 3s ease-in-out infinite}
@keyframes wob{50%{transform:rotate(-8deg) scale(1.1)}}
.fab{position:fixed;right:18px;bottom:calc(18px + env(safe-area-inset-bottom,0px));width:60px;height:60px;border-radius:50%;border:0;background:var(--accent);color:#fff;font-size:2rem;line-height:1;cursor:pointer;box-shadow:0 12px 24px -8px rgba(91,79,214,.7);transition:transform .3s cubic-bezier(.3,1.6,.5,1)}
.fab:hover{transform:rotate(90deg) scale(1.1)}
.sh{position:fixed;inset:0;z-index:60;background:rgba(39,38,74,.5);display:flex;align-items:flex-end;justify-content:center}
.sh[hidden]{display:none}
.sh .card{width:min(100%,560px);margin:0;border-radius:28px 28px 0 0;max-height:92vh;overflow:auto;background:#fff;animation:up .35s cubic-bezier(.2,.9,.3,1)}
html[data-theme=dark] .sh .card{background:#1b1a35}
@keyframes up{from{transform:translateY(40px);opacity:0}}
.pick{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.pick button{border:2px solid transparent;border-radius:14px;background:rgba(127,127,160,.16);color:var(--ink);font:inherit;cursor:pointer;padding:4px 10px;transition:transform .2s}
.pick button:hover{transform:scale(1.12) rotate(-4deg)}
.pick .on{border-color:var(--accent);background:var(--accent);color:#fff}
.pick.em button{font-size:1.4rem;padding:2px 8px}.pick.em .on{background:rgba(91,79,214,.25);color:inherit}
.pick.cl button{width:30px;height:30px;padding:0;border-radius:50%;background:var(--c)}.pick.cl .on{background:var(--c);border-color:var(--ink)}
.lbl{display:block;font-size:13px;color:var(--muted);margin:0 0 4px 4px}
.row input{margin:0}
@media (prefers-reduced-motion:reduce){.bl,.free .big,.bl .n{animation:none}}
</style></head>
<body>
<div class="wrap" id="m" hidden><div class="top" id="bar"></div>
  <div class="tabs" id="tabs"></div>
  <div class="hd" id="hd"></div>
  <div class="tl" id="tl"></div>
</div>
<button class="fab" id="fab" aria-label="Add a plan">+</button>
<div class="sh" id="sh" hidden><div class="card">
  <h2 id="sht" style="margin-bottom:12px">New plan</h2>
  <span class="lbl">Pick an emoji</span><div class="pick em" id="em"></div>
  <input id="ti" placeholder="What's the plan? e.g. Java class" maxlength="80">
  <div class="row" style="margin-bottom:12px"><div style="flex:1"><label class="lbl" for="s">Starts</label><input id="s" type="time"></div><div style="flex:1"><label class="lbl" for="e">Ends</label><input id="e" type="time"></div></div>
  <span class="lbl">Which days?</span><div class="pick" id="dys"></div>
  <span class="lbl">Colour</span><div class="pick cl" id="cl"></div>
  <input id="nt" placeholder="Note (optional)" maxlength="120">
  <div class="row"><button class="btn" id="sv">Save</button><button class="btn alt" id="cx">Cancel</button><button class="del" id="dl" hidden>Delete</button><span class="muted" id="st"></span></div>
</div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="auth.js"></script>
<script>
guard("Timetable",()=>{
const D=["Mon","Tue","Wed","Thu","Fri","Sat","Sun"],F=["Monday","Tuesday","Wednesday","Thursday","Friday","Saturday","Sunday"],C=["lilac","mint","peach","sky","butter","rose"],E=["📚","💻","🏃","🍜","😴","🎮","🎨","🧪","🚌","⭐"];
const TD=(new Date().getDay()+6)%7,hm=t=>String(t).slice(0,5),mins=t=>{const[a,b]=hm(t).split(":");return+a*60+ +b};
let rows=[],view=TD,edit=null,days=new Set(),col="lilac",em="📚";
const split=t=>{const m=String(t).match(/^(\p{Extended_Pictographic}\uFE0F?)\s+([\s\S]*)$/u);return m?[m[1],m[2]]:["",t]};
async function load(){
  const {data,error}=await sb.from("timetable").select("*").order("start_time");
  if(error){$("tl").innerHTML='<div class="card muted">Could not load your timetable.</div>';return}
  rows=data;tabs();day();
}
const tabs=()=>$("tabs").innerHTML=D.map((d,i)=>`<button class="dy${i===view?" on":""}${i===TD?" td":""}" data-v="${i}" aria-pressed="${i===view}">${d}<small>${rows.filter(r=>r.day===i).length||"·"}</small></button>`).join("");
function day(){
  const l=rows.filter(r=>r.day===view).sort((a,b)=>hm(a.start_time).localeCompare(hm(b.start_time)));
  const tot=l.reduce((a,r)=>a+Math.max(0,mins(r.end_time)-mins(r.start_time)),0),n=new Date(),nm=n.getHours()*60+n.getMinutes();
  $("hd").innerHTML=`<h2>${F[view]}${view===TD?" · today":""}</h2><span class="muted">${l.length?l.length+" plan"+(l.length>1?"s":"")+" · "+(tot/60).toFixed(1).replace(/\.0$/,"")+"h":"Nothing yet"}</span>`;
  $("tl").innerHTML=l.length?l.map((r,i)=>{const[e,t]=split(r.title),d=mins(r.end_time)-mins(r.start_time),live=view===TD&&nm>=mins(r.start_time)&&nm<mins(r.end_time);
    return`<button class="bl" data-id="${esc(r.id)}" style="--c:var(--${esc(r.color)});--i:${i};min-height:${Math.min(150,60+Math.max(0,d)*.4)}px"><span class="e">${esc(e||"⭐")}</span><span class="t"><b>${esc(t)}</b><small>${hm(r.start_time)} – ${hm(r.end_time)}${r.note?" · "+esc(r.note):""}</small></span>${live?'<span class="n">Now</span>':""}</button>`}).join(""):'<div class="free"><span class="big">🌿</span>Free day. Tap + to add something.</div>';
}
function drawSheet(){
  $("em").innerHTML=E.map(x=>`<button type="button" data-e="${x}" class="${x===em?"on":""}">${x}</button>`).join("");
  $("dys").innerHTML=D.map((d,i)=>`<button type="button" data-d="${i}" class="${days.has(i)?"on":""}">${d}</button>`).join("");
  $("cl").innerHTML=C.map(c=>`<button type="button" data-c="${c}" style="--c:var(--${c})" class="${c===col?"on":""}" aria-label="${c}"></button>`).join("");
}
function sheet(r){
  edit=r||null;days=new Set(r?[r.day]:[view]);col=r?r.color:"lilac";
  const[e,t]=r?split(r.title):["",""];em=e||"📚";
  $("ti").value=t;$("nt").value=r&&r.note||"";$("s").value=r?hm(r.start_time):"08:00";$("e").value=r?hm(r.end_time):"09:00";
  $("sht").textContent=r?"Edit plan":"New plan";$("dl").hidden=!r;$("st").textContent="";drawSheet();$("sh").hidden=false;
}
const close=()=>{$("sh").hidden=true;edit=null};
$("fab").onclick=()=>sheet(null);$("cx").onclick=close;
$("sh").onclick=e=>{if(e.target.id==="sh")close()};
addEventListener("keydown",e=>{if(e.key==="Escape"&&!$("sh").hidden)close()});
$("tabs").onclick=e=>{const b=e.target.closest("[data-v]");if(b){view=+b.dataset.v;tabs();day()}};
$("tl").onclick=e=>{const b=e.target.closest("[data-id]");if(b)sheet(rows.find(r=>r.id===b.dataset.id))};
$("em").onclick=e=>{const b=e.target.closest("[data-e]");if(b){em=b.dataset.e;drawSheet()}};
$("dys").onclick=e=>{const b=e.target.closest("[data-d]");if(!b)return;const d=+b.dataset.d;days.has(d)?days.delete(d):days.add(d);drawSheet()};
$("cl").onclick=e=>{const b=e.target.closest("[data-c]");if(b){col=b.dataset.c;drawSheet()}};
$("dl").onclick=async()=>{if(!edit||!confirm("Delete this plan?"))return;const {error}=await sb.from("timetable").delete().eq("id",edit.id);if(error){$("st").textContent="Could not delete.";return}close();load()};
$("sv").onclick=async()=>{
  const t=$("ti").value.trim(),s=$("s").value,e=$("e").value;
  if(!t||!days.size){$("st").textContent="Add a title and pick at least one day.";return}
  if(!s||!e||e<=s){$("st").textContent="The end time must be after the start.";return}
  const ds=[...days].sort(),mk=d=>({day:d,title:em+" "+t,start_time:s,end_time:e,color:col,note:$("nt").value.trim()});
  $("sv").disabled=true;let err;
  if(edit){({error:err}=await sb.from("timetable").update(mk(ds[0])).eq("id",edit.id));if(!err&&ds.length>1)({error:err}=await sb.from("timetable").insert(ds.slice(1).map(mk)))}
  else({error:err}=await sb.from("timetable").insert(ds.map(mk)));
  $("sv").disabled=false;
  if(err){$("st").textContent="Could not save.";return}
  view=ds[0];close();load();
};
setInterval(day,60000);
load();
});
</script></body></html>
