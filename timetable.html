<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><script src="theme.js"></script><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex"><title>Timetable</title>
<link rel="stylesheet" href="common.css">
<style>
.row input{margin:0}
.dys,.cl{display:flex;gap:6px;flex-wrap:wrap}
.dys button{border:2px solid transparent;border-radius:999px;background:#fff;color:var(--ink);font:inherit;font-weight:500;padding:5px 14px;cursor:pointer;transition:transform .2s,background .2s}
html[data-theme=dark] .dys button{background:#24234a}
.dys button:hover{transform:translateY(-2px)}.dys button.on{background:var(--accent);color:#fff}
.cl button{width:28px;height:28px;border-radius:50%;border:2px solid transparent;background:var(--c);cursor:pointer;transition:transform .2s}
.cl button:hover{transform:scale(1.2)}.cl button.on{border-color:var(--ink)}
.tt{display:grid;grid-template-columns:repeat(7,minmax(170px,1fr));gap:12px;overflow-x:auto;padding:4px 2px 18px;scroll-snap-type:x mandatory}
.dc{background:rgba(255,255,255,.55);border-radius:22px;padding:12px;scroll-snap-align:start;min-height:200px}
html[data-theme=dark] .dc{background:rgba(32,31,62,.6)}
.dc.today{box-shadow:inset 0 0 0 2px var(--accent)}
.dc h3{font-size:1.15rem;display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.dc h3 em{font:500 11px "DM Sans",sans-serif;font-style:normal;background:var(--accent);color:#fff;border-radius:999px;padding:2px 9px}
.blk{display:block;width:100%;text-align:left;border:0;border-radius:16px;background:var(--c);color:var(--ink);font:inherit;padding:10px 12px;margin-bottom:8px;cursor:pointer;transition:transform .25s,box-shadow .25s}
.blk:hover{transform:translateY(-3px) rotate(-.6deg);box-shadow:0 10px 20px -10px rgba(39,38,74,.45)}
.blk b{display:block;font-size:12.5px;color:var(--muted);font-weight:500}.blk span{display:block;font-weight:500;line-height:1.3}.blk small{color:var(--muted)}
.blk.live{animation:pulse 2s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 4px rgba(91,79,214,.35)}}
.empty{color:var(--muted);font-size:14px}
@media (prefers-reduced-motion:reduce){.blk.live{animation:none}}
</style></head>
<body>
<div class="wrap wide" id="m" hidden><div class="top" id="bar"></div>
  <div class="card">
    <div class="dys" id="dys" style="margin-bottom:12px"></div>
    <div class="row" style="margin-bottom:10px"><input id="ti" placeholder="What's the plan? e.g. Java class" maxlength="80" style="flex:2;min-width:200px"><input id="s" type="time" value="08:00" style="flex:1;min-width:110px" aria-label="Start"><input id="e" type="time" value="09:00" style="flex:1;min-width:110px" aria-label="End"></div>
    <input id="nt" placeholder="Note (optional)" maxlength="120">
    <div class="row"><div class="cl" id="cl"></div><span style="flex:1"></span><button class="del" id="dl" hidden>Delete</button><button class="btn alt sm" id="cx" hidden>Cancel</button><button class="btn" id="sv">Add to timetable</button></div>
    <p class="muted" id="st" style="margin:8px 0 0"></p>
  </div>
  <div class="tt" id="tt"></div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="auth.js"></script>
<script>
guard("Timetable",()=>{
const D=["Mon","Tue","Wed","Thu","Fri","Sat","Sun"],C=["lilac","mint","peach","sky","butter","rose"],today=(new Date().getDay()+6)%7;
let rows=[],edit=null,days=new Set([today]),col="lilac";
const hm=d=>String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0");
async function load(){
  const {data,error}=await sb.from("timetable").select("*").order("start_time");
  if(error){$("st").textContent="Could not load your timetable.";return}
  rows=data;draw();
}
function draw(){
  $("dys").innerHTML=D.map((d,i)=>`<button type="button" data-d="${i}" class="${days.has(i)?"on":""}">${d}</button>`).join("");
  $("cl").innerHTML=C.map(c=>`<button type="button" data-c="${c}" style="--c:var(--${c})" class="${c===col?"on":""}" aria-label="${c}"></button>`).join("");
  const now=hm(new Date());
  $("tt").innerHTML=D.map((d,i)=>{
    const l=rows.filter(r=>r.day===i);
    return`<div class="dc${i===today?" today":""}"><h3>${d}${i===today?"<em>Today</em>":""}</h3>`+(l.length?l.map(r=>`<button class="blk${i===today&&now>=r.start_time&&now<r.end_time?" live":""}" data-id="${esc(r.id)}" style="--c:var(--${esc(r.color)})"><b>${esc(r.start_time)} – ${esc(r.end_time)}</b><span>${esc(r.title)}</span>${r.note?`<small>${esc(r.note)}</small>`:""}</button>`).join(""):'<p class="empty">Free day</p>')+"</div>";
  }).join("");
  $("sv").textContent=edit?"Save changes":"Add to timetable";
  $("cx").hidden=$("dl").hidden=!edit;
}
function reset(){edit=null;days=new Set([today]);col="lilac";$("ti").value=$("nt").value="";$("s").value="08:00";$("e").value="09:00";$("st").textContent="";draw()}
$("dys").onclick=e=>{const b=e.target.closest("[data-d]");if(!b)return;const d=+b.dataset.d;days.has(d)?days.delete(d):days.add(d);draw()};
$("cl").onclick=e=>{const b=e.target.closest("[data-c]");if(b){col=b.dataset.c;draw()}};
$("tt").onclick=e=>{
  const b=e.target.closest("[data-id]");if(!b)return;
  const r=rows.find(x=>x.id===b.dataset.id);if(!r)return;
  edit=r;days=new Set([r.day]);col=r.color;$("ti").value=r.title;$("nt").value=r.note||"";$("s").value=r.start_time;$("e").value=r.end_time;draw();scrollTo({top:0,behavior:"smooth"});
};
$("cx").onclick=reset;
$("dl").onclick=async()=>{if(!edit||!confirm("Delete this block?"))return;const {error}=await sb.from("timetable").delete().eq("id",edit.id);if(error){$("st").textContent="Could not delete.";return}reset();load()};
$("sv").onclick=async()=>{
  const title=$("ti").value.trim(),s=$("s").value,e=$("e").value;
  if(!title||!days.size){$("st").textContent="Add a title and pick at least one day.";return}
  if(!s||!e||e<=s){$("st").textContent="The end time must be after the start time.";return}
  const ds=[...days].sort(),mk=d=>({day:d,title,start_time:s,end_time:e,color:col,note:$("nt").value.trim()});
  $("sv").disabled=true;let err;
  if(edit){
    ({error:err}=await sb.from("timetable").update(mk(ds[0])).eq("id",edit.id));
    if(!err&&ds.length>1)({error:err}=await sb.from("timetable").insert(ds.slice(1).map(mk)));
  }else({error:err}=await sb.from("timetable").insert(ds.map(mk)));
  $("sv").disabled=false;
  if(err){$("st").textContent="Could not save.";return}
  reset();load();
};
setInterval(draw,60000);
load();
});
</script></body></html>
